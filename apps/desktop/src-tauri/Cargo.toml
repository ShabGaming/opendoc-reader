[package]
name = "opendoc_reader"
version = "0.1.0"
description = "Local-only document OCR desktop app"
license = "MIT"
repository = "https://github.com/ShabGaming/opendoc-reader"
edition = "2021"
rust-version = "1.90"

[lib]
name = "opendoc_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
