[package]
name = "opendoc_reader"
version = "0.1.0"
description = "Local-only document OCR desktop app"
license = "MIT"
repository = "https://github.com/ShabGaming/opendoc-reader"
edition = "2021"
rust-version = "1.90"

[lib]
name = "opendoc_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
sha2 = "0.11.1"
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sysinfo = "0.38.4"
zip = "9.0.3"
flate2 = "1.1.10"
tar = "0.4.46"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
hex = "0.4.3"
rand = "0.10.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset", "system-proxy"] }
indexmap = { version = "2.14.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target."cfg(windows)".dependencies]
nvml-wrapper = "0.13.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
