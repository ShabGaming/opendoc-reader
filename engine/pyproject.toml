[project]
name = "opendoc-engine"
version = "0.1.0"
description = "Local document-conversion engine for OpenDoc Reader (JSON-RPC sidecar)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.3.5",
    "paddleocr[doc-parser]>=3.7,<3.8",
    "paddlepaddle>=3.3,<3.4",
    "pi-heif>=1.4.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "latex2mathml>=3.77",
    "lxml>=5.2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendoc_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The converters name math symbols by the characters themselves.
"src/opendoc_engine/exporters/omml.py" = ["RUF001"]
"scripts/build_reference_template.py" = ["RUF001"]
"tests/fixtures/*" = ["E501"]
