[project]
name = "opendoc-engine"
version = "0.1.0"
description = "Local document-conversion engine for OpenDoc Reader (JSON-RPC sidecar)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendoc_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
