version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      uv:
        update-types: [minor, patch]
