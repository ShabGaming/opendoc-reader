name: Release

# Installers are built when a GitHub release is published: the maintainer drafts
# a release for a tag such as v0.1.0 in the GitHub UI and publishes it, and this
# workflow attaches the Windows and macOS installers to that same release. It
# creates no release or tag of its own. Run it by hand (Actions, Release, Run
# workflow) for a test build: the installers are kept as workflow artifacts and
# no release is touched.
# See docs/adr/0011-monorepo-and-tag-triggered-draft-releases.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tag, without a leading v, must be the version the installers are built
      # with. Manual test builds have no tag, so they skip the comparison.
      - name: Compare the tag with the app version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          tauri=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          echo "tag $TAG, tauri.conf.json $tauri, package.json $pkg"
          if [ "$tauri" != "$expected" ] || [ "$pkg" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match tauri.conf.json ($tauri) and package.json ($pkg). Fix the versions or the tag before publishing."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # uv ships inside the installer as a sidecar (tauri.conf.json, bundle.externalBin).
      # The pinned archive is checked against its SHA-256 before it is used.
      - name: Fetch the uv sidecar
        run: node scripts/fetch-uv.mjs --target ${{ matrix.target }}

      # Published release: build and upload the installers to that release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free ad-hoc signing on macOS, which Apple Silicon needs to run the
          # app. No certificate, no notarization (ADR 0009). Ignored on Windows.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ github.event.release.id }}

      # Manual run: build only, and keep the installers as workflow artifacts.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: github.event_name == 'workflow_dispatch'
        id: test_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: installers-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
