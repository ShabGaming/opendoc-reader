name: Release

# Pushing a tag such as v0.1.0 builds the installers and attaches them to a
# draft GitHub release. The maintainer tests the builds and publishes by hand.
# See docs/adr/0011-monorepo-and-tag-triggered-draft-releases.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # uv ships inside the installer as a sidecar (tauri.conf.json, bundle.externalBin).
      # The pinned archive is checked against its SHA-256 before it is used.
      - name: Fetch the uv sidecar
        run: node scripts/fetch-uv.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free ad-hoc signing on macOS, which Apple Silicon needs to run the
          # app. No certificate, no notarization (ADR 0009). Ignored on Windows.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDoc Reader ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
