name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-web:
    name: Desktop (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop lint
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop build

  desktop-rust:
    name: Desktop (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! reads the built frontend (frontendDist: ../dist),
      # so the frontend must exist before clippy and the tests compile the crate.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build

      # The uv sidecar is declared in tauri.conf.json and bundled with the app. The build
      # script would write an empty placeholder, but fetching the real one keeps this job
      # honest about the download and the pinned checksum.
      - name: Fetch the uv sidecar
        run: node scripts/fetch-uv.mjs

      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  engine:
    name: Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The Fast tier is the only one that runs without a GPU or llama-server, so it is what CI
  # checks against the golden pages (engine/tests/golden/SOURCES.md). The models are fetched
  # from the URLs in models/manifest.json, checked against their SHA-256 and cached until the
  # manifest changes.
  golden:
    name: Golden tests (Fast tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Cache the Fast tier models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: fast-models-${{ hashFiles('models/manifest.json') }}

      - name: Fetch the Fast tier models
        run: python3 scripts/fetch-models.py --tier fast --out .cache/models

      - name: Install the engine environment
        working-directory: engine
        run: uv sync --locked

      - name: Run the golden tests
        working-directory: engine
        env:
          OPENDOC_GOLDEN: "1"
          OPENDOC_MODELS_DIR: ${{ github.workspace }}/.cache/models
        run: uv run pytest tests/test_golden.py -v
